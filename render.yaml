databases:
  - name: classtask-db
    plan: free
    databaseName: classtask
    user: classtask

services:
  # Single web service: Express API + built React frontend (same origin)
  - type: web
    name: classtask
    runtime: node
    plan: free
    branch: main
    buildCommand: cd frontend && npm ci --include=dev && npm run build && cd ../backend && npm ci --include=dev && npm run build
    startCommand: cd backend && npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: classtask-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Set to https://<your-service>.onrender.com/api/auth/google/callback
      - key: GOOGLE_CALLBACK_URL
        sync: false
      # Set to https://<your-service>.onrender.com
      - key: FRONTEND_URL
        sync: false

services:
  # ---------- 1️⃣ Backend Web Service ----------
  - type: web
    name: classtask-backend
    env: node
    plan: free   # ฟรี tier ของ Render มี 1 web service
    branch: main
    repo: https://github.com/facebookxrpon-create/classroom1.git
    rootDir: backend
    buildCommand: npm ci && npm run build   # หรือ npm run start ถ้าไม่มี build script
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        sync: false        # ให้คุณตั้งค่าใน UI ของ Render
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false        # จะตั้งค่าเป็น URL ของ static site หลังสร้าง

  # ---------- 2️⃣ Front‑end Static Site ----------
  - type: static
    name: classtask-frontend
    branch: main
    repo: https://github.com/facebookxrpon-create/classroom1.git
    rootDir: frontend            # โฟลเดอร์ที่มี package.json ของ React/Vite
    buildCommand: npm ci && npm run build
    publishPath: dist            # Vite สร้างไฟล์ที่โฟลเดอร์ dist
    envVars: []                  # ไม่ต้องมี secret สำหรับ static site
